<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Architect | Cloud Demo Portal</title>
  <meta http-equiv="refresh" content="0; url=./index.html" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      background:
        radial-gradient(820px 440px at -8% 2%, rgba(17, 164, 136, .18), transparent 62%),
        radial-gradient(920px 520px at 108% -8%, rgba(29, 99, 255, .18), transparent 58%),
        linear-gradient(180deg, #f8fbff 0%, #eef3fb 100%);
      color: #11243f;
    }

    .card {
      width: min(560px, 92vw);
      border: 1px solid #d9e3f2;
      border-radius: 16px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 16px 34px rgba(14, 32, 56, .12);
      padding: 24px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.2;
    }

    p {
      margin: 10px 0 0;
      color: #60718a;
      line-height: 1.55;
      font-size: .9rem;
    }

    a {
      display: inline-block;
      margin-top: 14px;
      color: #1d63ff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
  <script>
    window.location.replace("./index.html");
  </script>
</head>
<body>
  <main class="card">
    <h1>Redirecting to AI Architect Cloud Studio</h1>
    <p>The cloud demo portal opens the canonical studio experience so every shared link lands on the live production surface.</p>
    <a href="./index.html">Open Studio</a>
  </main>
</body>
</html>
