name: Render Keepalive

on:
  push:
    branches:
      - main
  schedule:
    # GitHub Actions minimum cron interval is 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render target
        run: |
          set -euo pipefail
          target="https://alphadome.onrender.com/"
          echo "Pinging  at 2026-08-06T12:02:28Z"
          status=
          echo "HTTP status: "
          if [ "" -lt 200 ] || [ "" -ge 500 ]; then
            echo "Unexpected status code: "
            exit 1
          fi
